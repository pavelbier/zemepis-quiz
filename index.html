<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Severní Amerika – členitost</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1c2430;--muted:#5c6b7a;--land:#e8e2cf;--sea:#dcecf7;--line:#9a8f6e;--acc:#d62839;--ok:#2e9e5b;--bad:#d62839;--btn:#fff;--btnb:#c5cfd9}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1e242b;--text:#e8edf2;--muted:#9aa8b6;--land:#4a4636;--sea:#1b2f3f;--line:#7d7558;--btn:#272f38;--btnb:#3c4854}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:.9rem}
select,button{font:inherit;color:var(--text)}
select{padding:4px 8px;border-radius:6px;background:var(--btn);border:1px solid var(--btnb)}
.bar{height:6px;background:var(--btnb);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
svg{width:100%;height:auto;display:block;background:var(--sea);border-radius:8px}
.land{fill:var(--land);stroke:var(--line);stroke-width:.6;stroke-linejoin:round}
.hl{fill:#d6283955;stroke:var(--acc);stroke-width:3}
.hl.line{fill:none;stroke:#d62839aa;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.hl.pulse{animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.45}}
.q{font-weight:600;margin:12px 0 8px}
.opts{display:grid;gap:8px}
.opts button{padding:10px 12px;text-align:left;background:var(--btn);border:1px solid var(--btnb);border-radius:8px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--acc)}
.opts button.ok{background:#2e9e5b33;border-color:var(--ok)}
.opts button.bad{background:#d6283933;border-color:var(--bad)}
.opts button:disabled{cursor:default}
.next{margin-top:12px;padding:10px 18px;background:var(--acc);color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:600}
.msg{min-height:1.4em;margin-top:8px;font-weight:600}
.end{text-align:center;padding:20px 0}
.hide{display:none}
@media(min-width:760px){.opts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>Severní Amerika – členitost</h1>
<div class="card">
  <div class="top">
    <label>Téma: <select id="cat"></select></label>
    <span id="stat"></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div id="quiz">
    <svg id="map" viewBox="0 0 1000 900" role="img" aria-label="Mapa Severní Ameriky"></svg>
    <div class="q" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg"></div>
    <button class="next hide" id="next">Další →</button>
  </div>
  <div id="end" class="end hide">
    <h2>Hotovo! 🎉</h2>
    <p id="endtxt"></p>
    <button class="next" id="again">Začít znovu</button>
  </div>
</div>
</main>

/* ---- projekce (Lambertova azimutální) ---- */
const L0=-98*Math.PI/180,P0=50*Math.PI/180,W=1000;
function proj(lon,lat){
  const l=lon*Math.PI/180,p=lat*Math.PI/180;
  const k=Math.sqrt(2/(1+Math.sin(P0)*Math.sin(p)+Math.cos(P0)*Math.cos(p)*Math.cos(l-L0)));
  return [k*Math.cos(p)*Math.sin(l-L0),-k*(Math.cos(P0)*Math.sin(p)-Math.sin(P0)*Math.cos(p)*Math.cos(l-L0))];
}
let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
const polys=GEO.map(g=>{const pts=[];for(let i=0;i<g.p.length;i+=2){const q=proj(g.p[i],g.p[i+1]);pts.push(q)}
  pts.forEach(q=>{minx=Math.min(minx,q[0]);maxx=Math.max(maxx,q[0]);miny=Math.min(miny,q[1]);maxy=Math.max(maxy,q[1])});return pts});
const S=(W-20)/(maxx-minx),H=Math.round((maxy-miny)*S+20);
function P(lon,lat){const q=proj(lon,lat);return [10+(q[0]-minx)*S,10+(q[1]-miny)*S]}
const map=document.getElementById('map');
map.setAttribute('viewBox',`0 0 ${W} ${H}`);
const NS='http://www.w3.org/2000/svg';
const land=document.createElementNS(NS,'path');land.setAttribute('class','land');
land.setAttribute('d',polys.map(r=>'M'+r.map(q=>(10+(q[0]-minx)*S).toFixed(1)+' '+(10+(q[1]-miny)*S).toFixed(1)).join('L')+'Z').join(''));
map.appendChild(land);
const hlg=document.createElementNS(NS,'g');map.appendChild(hlg);

const CATS=['Vše',...new Set(ITEMS.map(i=>i.c))];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=id=>document.getElementById(id);
const QUESTION={Ostrovy:'Který ostrov je vyznačen?',Poloostrovy:'Který poloostrov je vyznačen?',Zálivy:'Který záliv je vyznačen?','Pohoří a nížiny':'Co je vyznačeno?'};

let queue,total,done,tries,cur,wrongSet,answered;

function start(){
  const pool=ITEMS.filter(i=>catSel.value==='Vše'||i.c===catSel.value);
  queue=shuffle(pool);total=pool.length;done=0;tries=0;wrongSet=new Set();
  $('quiz').classList.remove('hide');$('end').classList.add('hide');
  next();
}
function draw(it){
  hlg.innerHTML='';
  let el;
  if(it.e){const [lon,lat,rx,ry,rot]=it.e,[x,y]=P(lon,lat);
    el=document.createElementNS(NS,'ellipse');
    el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('rx',rx*W/1000*0.5);el.setAttribute('ry',ry*W/1000*0.5);
    el.setAttribute('transform',`rotate(${rot} ${x} ${y})`);el.setAttribute('class','hl pulse');
  }else{
    el=document.createElementNS(NS,'path');
    el.setAttribute('d','M'+it.l.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(' ')).join('L'));
    el.setAttribute('class','hl line pulse');
  }
  hlg.appendChild(el);
}
function next(){
  if(!queue.length){finish();return}
  cur=queue.shift();answered=false;
  draw(cur);
  $('qtext').textContent=QUESTION[cur.c];
  $('msg').textContent='';$('next').classList.add('hide');
  const same=ITEMS.filter(i=>i.c===cur.c&&i!==cur);
  let others=shuffle(same).slice(0,4);
  if(others.length<4)others=others.concat(shuffle(ITEMS.filter(i=>i.c!==cur.c)).slice(0,4-others.length));
  const opts=shuffle([cur,...others]);           // odpovědi se pokaždé zamíchají
  const box=$('opts');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');b.textContent=o.n;
    b.onclick=()=>answer(b,o,box);box.appendChild(b);
  });
  updateStat();
}
function answer(btn,o,box){
  if(answered)return;
  answered=true;
  [...box.children].forEach(b=>b.disabled=true);
  if(o===cur){
    btn.classList.add('ok');done++;
    $('msg').textContent='✔ Správně!';
  }else{
    btn.classList.add('bad');
    [...box.children].forEach(b=>{if(b.textContent===cur.n)b.classList.add('ok')});
    $('msg').textContent='✘ Špatně. Správně je: '+cur.n+'. Otázka se za chvíli vrátí.';
    wrongSet.add(cur);
    // chybná otázka se vrátí do fronty za 2–4 další
    queue.splice(Math.min(queue.length,2+Math.floor(Math.random()*3)),0,cur);
  }
  $('next').classList.remove('hide');$('next').focus();
  updateStat();
}
function updateStat(){
  $('stat').textContent=`Hotovo: ${done} / ${total} · Chybných: ${wrongSet.size}`;
  $('bar').style.width=(100*done/total)+'%';
}
function finish(){
  $('quiz').classList.add('hide');$('end').classList.remove('hide');
  $('bar').style.width='100%';
  $('endtxt').textContent=`Správně napoprvé: ${total-wrongSet.size} z ${total}.`+(wrongSet.size?` Procvičené chyby: ${[...wrongSet].map(i=>i.n).join(', ')}.`:' Bez chyby!');
}
$('next').onclick=next;$('again').onclick=start;catSel.onchange=start;
start();
